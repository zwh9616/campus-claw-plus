name: Bootstrap checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'docs/**']
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm run setup
      - name: Run the same complete gate as local development
        run: |
          echo 'HTTP_PORT=18080' > .env
          make gate
      - name: Retain runtime image scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-image-scans-${{ github.sha }}
          path: |
            output/mysql-image-verify/results.json
            output/mysql-image-verify/mysql.json
            output/application-image-verify/results.json
            output/application-image-verify/backend.json
            output/application-image-verify/admin.json
            output/application-image-verify/frontend.json
            output/identity/results.json
            output/identity-wiring/results.json
            output/verification/gate-results.json
            output/service-batches/results.json
            output/document-parser/check/results.json
            output/document-parser/check/tests.json
            output/document-parser/scan/results.json
            output/document-parser/scan/tests.json
            output/document-parser/scan/parser.json
            output/document-storage-contract/results.json
            output/document-storage-contract/queue-test.log
          if-no-files-found: ignore
