name: Bootstrap checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**', 'docs/**']
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm run setup
      - run: npm run check
      - run: npm run audit
      - run: npm run secret-scan
      - name: Verify real containers and process exit codes
        run: |
          echo 'HTTP_PORT=18080' > .env
          npm run verify
