worker_processes auto;
error_log /var/log/nginx/error.log error;
pid /var/run/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format structured escape=json '{"ts":"$time_iso8601","level":"info","module":"frontend","message":"request completed","request_id":"$request_id","method":"$request_method","path":"$uri","status":$status,"duration_seconds":$request_time}';
  access_log /dev/stdout structured;
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Request-ID $request_id always;
    add_header X-Content-Type-Options nosniff always;
    location / { try_files $uri $uri/ /index.html; }
  }
}
