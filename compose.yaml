name: campus-claw-plus
services:
  frontend:
    image: campus-claw-plus/frontend:0.0.1
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    stop_grace_period: 15s
    restart: "no"
  backend:
    image: campus-claw-plus/backend:0.0.1
    build:
      context: ./backend
    environment:
      HTTP_PORT: ${HTTP_PORT:?Fill HTTP_PORT in the root .env}
    ports:
      - "127.0.0.1:${HTTP_PORT}:${HTTP_PORT}"
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5
    stop_grace_period: 15s
    restart: "no"
